<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D First-Person Shooter | Phaser</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }
        
        #game-container {
            text-align: center;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            z-index: 100;
        }
        
        .ui-item {
            margin: 10px 0;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff00;
            border-radius: 5px;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 101;
        }
        
        .crosshair-line {
            position: absolute;
            background: #00ff00;
        }
        
        .crosshair-h {
            width: 15px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
        }
        
        .crosshair-v {
            width: 2px;
            height: 15px;
            top: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui">
        <div class="ui-item">Health: <span id="health">100</span></div>
        <div class="ui-item">Ammo: <span id="ammo">30</span></div>
        <div class="ui-item">Score: <span id="score">0</span></div>
        <div class="ui-item">Wave: <span id="wave">1</span></div>
        <div class="ui-item" style="margin-top: 20px; font-size: 14px;">
            <div>WASD - Move</div>
            <div>Mouse - Look Around</div>
            <div>Click - Shoot</div>
            <div>R - Reload</div>
            <div>Space - Jump</div>
        </div>
    </div>
    <div id="crosshair">
        <div class="crosshair-line crosshair-h"></div>
        <div class="crosshair-line crosshair-v"></div>
    </div>
    <script src="game.js"></script>
</body>
</html>
